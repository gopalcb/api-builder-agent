<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">API Builder Agent quick demo</title>
  <desc id="desc">A preview card for the API Builder Agent demo video. Click to play the demo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="1080" cy="70" r="220" fill="#38bdf8" opacity=".12"/>
  <circle cx="160" cy="690" r="250" fill="#818cf8" opacity=".12"/>
  <rect x="112" y="90" width="1056" height="540" rx="18" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="112" y="90" width="1056" height="56" rx="18" fill="#e2e8f0"/>
  <circle cx="146" cy="118" r="8" fill="#fb7185"/>
  <circle cx="172" cy="118" r="8" fill="#fbbf24"/>
  <circle cx="198" cy="118" r="8" fill="#34d399"/>
  <rect x="154" y="184" width="190" height="386" rx="10" fill="#0f172a"/>
  <rect x="182" y="224" width="126" height="12" rx="6" fill="#38bdf8"/>

  <rect x="182" y="294" width="112" height="10" rx="5" fill="#64748b"/>
  <rect x="182" y="324" width="82" height="10" rx="5" fill="#64748b"/>
  <rect x="182" y="382" width="136" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="182" y="472" width="136" height="66" rx="8" fill="#1e293b"/>
  <rect x="386" y="184" width="728" height="386" rx="10" fill="#ffffff"/>
  <text x="430" y="250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Design your API</text>
  <text x="430" y="286" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#64748b">Projects, entities, agents, and build artifacts in one workspace.</text>
  <rect x="430" y="332" width="270" height="112" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="730" y="332" width="270" height="112" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="430" y="470" width="570" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="430" y="508" width="430" height="18" rx="9" fill="#e2e8f0"/>
  <circle cx="692" cy="388" r="64" fill="#0f172a" opacity=".94"/>
  <path d="M675 354 L675 422 L730 388 Z" fill="#ffffff"/>
  <text x="640" y="670" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#e0f2fe">Click to play the API Builder Agent demo</text>
